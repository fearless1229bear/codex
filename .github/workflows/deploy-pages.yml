name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: configuration
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployment result
        if: always()
        env:
          CONFIGURATION_RESULT: ${{ steps.configuration.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
          DEPLOYMENT_RESULT: ${{ steps.deployment.outcome }}
        run: |
          STATUS_TAG="pages-${CONFIGURATION_RESULT}-${UPLOAD_RESULT}-${DEPLOYMENT_RESULT}-${GITHUB_RUN_ID}"
          git tag "${STATUS_TAG}"
          git push origin "${STATUS_TAG}"
