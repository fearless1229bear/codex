<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="按日历记录和查阅每日任务的轻量任务本。" />
    <title>每日任务本</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <aside class="calendar-panel">
        <div class="brand" aria-label="每日任务本">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m7 12.5 3.1 3.1L17.5 8" /></svg>
          </span>
          <span>每日任务本</span>
        </div>

        <div class="calendar-copy">
          <p class="eyebrow">我的日程</p>
          <h1>每一天，<br /><em>都有迹可循。</em></h1>
          <p class="intro">在日历中选择日期，记录计划，也随时回看走过的每一天。</p>
        </div>

        <section class="calendar-card" aria-label="任务日历">
          <div class="calendar-header">
            <button class="month-button" id="previousMonth" type="button" aria-label="上个月">‹</button>
            <h2 id="calendarMonth">2026年10月</h2>
            <button class="month-button" id="nextMonth" type="button" aria-label="下个月">›</button>
          </div>
          <div class="weekdays" aria-hidden="true">
            <span>一</span><span>二</span><span>三</span><span>四</span>
            <span>五</span><span>六</span><span>日</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
          <div class="calendar-footer">
            <span><i aria-hidden="true"></i>有任务</span>
            <button id="goToday" type="button">回到今天</button>
          </div>
        </section>

        <div class="progress-card" aria-live="polite">
          <div>
            <span class="progress-label">所选日期进度</span>
            <strong id="progressText">还没有任务</strong>
          </div>
          <div class="progress-ring" id="progressRing" aria-hidden="true">
            <span id="progressPercent">0%</span>
          </div>
        </div>
      </aside>

      <main class="task-panel">
        <header class="day-header">
          <div>
            <p class="day-kicker" id="dayKicker">今天</p>
            <h2 id="selectedDate">10月9日 星期五</h2>
          </div>
          <span class="date-badge" id="dateBadge">今天</span>
        </header>

        <form class="task-form" id="taskForm">
          <div class="form-heading">
            <span class="input-icon" aria-hidden="true">＋</span>
            <strong id="formHeading">添加任务</strong>
          </div>
          <label for="taskTitle">任务标题</label>
          <input id="taskTitle" name="title" type="text" maxlength="100"
            autocomplete="off" placeholder="例如：整理本周工作计划" required />
          <label for="taskDetails">具体内容</label>
          <textarea id="taskDetails" name="details" rows="4" maxlength="2000"
            placeholder="写下具体步骤或备注，可按回车分段……"></textarea>
          <div class="form-actions">
            <button class="cancel-button" id="cancelEdit" type="button" hidden>取消编辑</button>
            <button class="submit-button" id="submitTask" type="submit">添加到这一天</button>
          </div>
        </form>

        <div class="toolbar">
          <div class="filters" aria-label="筛选任务">
            <button class="filter active" type="button" data-filter="all" aria-pressed="true">全部</button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false">待完成</button>
            <button class="filter" type="button" data-filter="completed" aria-pressed="false">已完成</button>
          </div>
          <button class="clear-button" id="clearCompleted" type="button">清除已完成</button>
        </div>

        <section class="task-list-wrap" aria-labelledby="listTitle">
          <div class="list-heading">
            <h2 id="listTitle">这一天的任务</h2>
            <span id="taskCount">0 项</span>
          </div>
          <ul class="task-list" id="taskList"></ul>
          <div class="empty-state" id="emptyState">
            <div class="empty-icon" aria-hidden="true">✓</div>
            <h3 id="emptyTitle">这一天还没有任务</h3>
            <p id="emptyText">在上方写下第一件要完成的事。</p>
          </div>
        </section>
      </main>
    </div>

    <template id="taskTemplate">
      <li class="task-item">
        <label class="task-check">
          <input type="checkbox" />
          <span class="checkmark" aria-hidden="true">
            <svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7" /></svg>
          </span>
        </label>
        <div class="task-content">
          <h3 class="task-title"></h3>
          <p class="task-details"></p>
        </div>
        <div class="task-actions">
          <button class="icon-button edit-button" type="button" aria-label="编辑任务">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m14 5 5 5M4 20l3.5-.7L19 7.8a1.4 1.4 0 0 0 0-2L18.2 5a1.4 1.4 0 0 0-2 0L4.7 16.5 4 20Z" />
            </svg>
          </button>
          <button class="icon-button delete-button" type="button" aria-label="删除任务">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 7h12M10 11v5M14 11v5M9 7l1-2h4l1 2m1 0-.6 12H8.6L8 7" />
            </svg>
          </button>
        </div>
      </li>
    </template>
  </body>
</html>
