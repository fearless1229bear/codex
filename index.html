<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个简洁、轻量的今日任务清单。" />
    <title>今日清单</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="brand" aria-label="今日清单">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m7 12.5 3.1 3.1L17.5 8" /></svg>
          </span>
          <span>今日清单</span>
        </div>

        <div class="hero-copy">
          <p class="eyebrow" id="today">今天</p>
          <h1>把重要的事，<br /><em>一件件完成。</em></h1>
          <p class="intro">记录此刻要做的事，把精力留给真正重要的部分。</p>
        </div>

        <div class="progress-card" aria-live="polite">
          <div>
            <span class="progress-label">今日进度</span>
            <strong id="progressText">还没有任务</strong>
          </div>
          <div class="progress-ring" id="progressRing" aria-hidden="true">
            <span id="progressPercent">0%</span>
          </div>
        </div>
      </header>

      <main class="task-panel">
        <form class="task-form" id="taskForm">
          <label class="sr-only" for="taskInput">新任务</label>
          <span class="input-icon" aria-hidden="true">＋</span>
          <input id="taskInput" name="task" type="text" maxlength="100"
            autocomplete="off" placeholder="接下来要做什么？" required />
          <button type="submit">添加任务</button>
        </form>

        <div class="toolbar">
          <div class="filters" aria-label="筛选任务">
            <button class="filter active" type="button" data-filter="all" aria-pressed="true">全部</button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false">待完成</button>
            <button class="filter" type="button" data-filter="completed" aria-pressed="false">已完成</button>
          </div>
          <button class="clear-button" id="clearCompleted" type="button">清除已完成</button>
        </div>

        <section class="task-list-wrap" aria-labelledby="listTitle">
          <div class="list-heading">
            <h2 id="listTitle">我的任务</h2>
            <span id="taskCount">0 项</span>
          </div>
          <ul class="task-list" id="taskList"></ul>
          <div class="empty-state" id="emptyState">
            <div class="empty-icon" aria-hidden="true">✓</div>
            <h3>今天从容开始</h3>
            <p>在上方写下第一件要完成的事。</p>
          </div>
        </section>
      </main>
    </div>

    <template id="taskTemplate">
      <li class="task-item">
        <label class="task-check">
          <input type="checkbox" />
          <span class="checkmark" aria-hidden="true">
            <svg viewBox="0 0 20 20"><path d="m5 10 3 3 7-7" /></svg>
          </span>
          <span class="task-text"></span>
        </label>
        <button class="delete-button" type="button" aria-label="删除任务">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 7h12M10 11v5M14 11v5M9 7l1-2h4l1 2m1 0-.6 12H8.6L8 7" />
          </svg>
        </button>
      </li>
    </template>
  </body>
</html>
